[project]
name = "woowangthon-notice-ai"
version = "0.1.0"
description = "공지 근거 기반 답변 AI 서비스"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.34,<1.0",
    "anthropic>=0.49,<1.0",
    "openai>=1.65,<3.0",
]

[build-system]
requires = ["hatchling>=1.27,<2.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/notice_ai"]
